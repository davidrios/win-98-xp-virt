[package]
name = "player"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone player: in-process QEMU + wgpu/librashader display (doc 02/03). M0: native window + test pattern."

[dependencies]
qemu-embed = { path = "../qemu-embed" }
winit = "0.30"
libc = "0.2"
serde_json = "1"
ash = "0.38"

wgpu = "30"
pollster = "1"
bytemuck = "1"
png = "0.18"
cpal = "0.18.2"
librashader = { version = "0.12", default-features = false, features = ["runtime-wgpu", "presets", "preprocess", "reflect"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-metal = { version = "0.3", features = ["MTLDevice", "MTLTexture", "MTLPixelFormat", "objc2-io-surface"] }
objc2-io-surface = { version = "0.3", features = ["IOSurfaceRef"] }
