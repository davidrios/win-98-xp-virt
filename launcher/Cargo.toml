[package]
name = "launcher"
version.workspace = true
edition.workspace = true
# Deliberately NOT the workspace's `GPL-2.0-only` (ADR-009): this binary
# links no QEMU code — it spawns the player as a separate process — and
# it does link Apache-2.0 crates (egui's `ab_glyph`, winit's `dpi`,
# `ring` under `ureq`'s rustls), which GPLv2 cannot take and GPLv3 can.
# "or-later" lets the combined binary be distributed under v3.
license = "GPL-2.0-or-later"
description = "Companion launcher, egui/eframe front end: the machine library, guided creation, disc shelf (doc 07)."

[dependencies]
# Everything this launcher *decides* (doc 07): bundles, the library, the
# disc shelf, snapshots, shader profiles, every window's model and every
# toolkit-free debug verb. `launcher-qt` links the same crate. All the
# dependencies those need — `directories`, `serde`, `toml`, `ureq`,
# `librashader`, `wgpu` … — came with it and are no longer named here.
launcher-core = { path = "../launcher-core" }
eframe = "0.36.1"
egui = "0.36.1"
# Native system file dialog for the wizard's path fields — NSOpenPanel on
# macOS, the Win32 IFileDialog on Windows, the XDG desktop portal (over
# D-Bus) on Linux/BSD. `xdg-portal` (not the default `gtk3`) selects the
# portal backend so the Linux build needs no GTK; `default-features =
# false` also drops rfd's `wayland` feature (the dialog isn't parented to
# our window on Wayland, but is still a normal top-level). Needs a
# running xdg-desktop-portal service at runtime, standard on modern
# desktops. This is the dependency the Qt build does not have: Qt ships
# its own dialog onto the same three backends.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# The window icon, decoded from the PNG rendered off the desktop entry's
# own SVG. (The shader preview's image decoding is `launcher-core`'s.)
image = { version = "0.25", default-features = false, features = ["png"] }
# `dump_texture` for the diagnostic verbs, which paint a real egui frame
# into an off-screen texture and write it out.
shader-chain = { path = "../shader-chain" }
# Blocks on `egui_wgpu::RenderState::create` for those same verbs (a
# headless render state, no window).
pollster = "1"
