[package]
name = "launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Companion launcher: machine library, guided creation, disc shelf (doc 07). M6: egui skeleton."

[dependencies]
directories = "6.0.0"
eframe = "0.36.1"
egui = "0.36.1"
# Native system file dialog for the wizard's path fields — NSOpenPanel on
# macOS, the Win32 IFileDialog on Windows, the XDG desktop portal (over
# D-Bus) on Linux/BSD. `xdg-portal` (not the default `gtk3`) selects the
# portal backend so the Linux build needs no GTK; `default-features =
# false` also drops rfd's `wayland` feature (the dialog isn't parented to
# our window on Wayland, but is still a normal top-level). Needs a
# running xdg-desktop-portal service at runtime, standard on modern
# desktops.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
# `qemu-img info --output=json` for the snapshot list (a stable interface;
# `qemu-img snapshot -l`'s table is formatted for humans and doesn't
# escape a tag with a space in it). Same crate the player uses for QMP.
serde_json = "1"
toml = "1.1.5"
# Preset/parameter introspection only (no runtime backend) — the profile
# manager lists a `.slangp`'s parameters to draw sliders. Actually
# running the filter chain (the live preview) goes through `shader-chain`
# instead, on the `wgpu::Device`/`Queue` eframe itself already opened for
# egui (`egui_wgpu::RenderState`, via `eframe::wgpu`/`eframe::egui_wgpu` —
# no separate `wgpu` pin needed here, Cargo unifies it with `shader-chain`'s).
librashader = { version = "0.12", default-features = false, features = ["presets", "preprocess"] }
shader-chain = { path = "../shader-chain" }
# Decodes a preview screenshot (PNG/JPEG/BMP) into RGBA8 for the shader
# preview's input texture.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
# Blocks on `egui_wgpu::RenderState::create` for the `--preview-shader`
# debug verb (a headless render state, no window) — matches the player's
# own use for its (windowed) adapter/device request.
pollster = "1"
