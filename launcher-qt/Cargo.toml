[package]
name = "launcher-qt"
version = "0.0.1"
edition = "2021"
# Same reasoning as `launcher/Cargo.toml`: this binary links no QEMU code
# (it spawns the player as a separate process) and does link permissively
# licensed crates, so "or later" lets the combined binary go out under
# v3. Qt 6 itself is LGPLv3 here, which GPL-2.0-only could not take and
# GPL-2.0-or-later can — see `docs/07-frontend.md`.
license = "GPL-2.0-or-later"
description = "Companion launcher, Qt 6 / QML front end over launcher-core (cxx-qt)."

# Deliberately its OWN workspace, excluded from the root one: a plain
# `cargo build` at the repository root must not start needing Qt 6
# development files (the Mac side, CI, the Flatpak runtime). Build this
# crate explicitly, from this directory. The `launcher-core` path
# dependency crosses the workspace boundary without dragging Qt back
# the other way.
[workspace]

[dependencies]
# The same crate `launcher/` (egui) is built on, and the reason this
# front end is a few thousand lines of view code rather than a second
# implementation of the launcher: every window's state machine, the
# bundle format, the disc shelf, snapshots, shader profiles, the preview's
# render path and the toolkit-free debug verbs are all in there.
launcher-core = { path = "../launcher-core" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
# The preview frame reaches QML through a BMP on disk (see `preview.rs`
# for why), which is the only image encoding this crate does itself.
image = { version = "0.25", default-features = false, features = ["bmp"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
